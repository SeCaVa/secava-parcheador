name: Validar pull request
on: pull_request
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run demo
      - run: npm test
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegadores de prueba (con reintentos)
        timeout-minutes: 25
        run: |
          for intento in 1 2 3; do
            timeout 420 npx playwright install --with-deps chromium firefox webkit && exit 0
            echo "Intento $intento fallido o colgado; limpiando apt y reintentando…"
            # Cortar apt a medias deja el cerrojo de dpkg puesto: se libera antes de repetir.
            sudo pkill -9 -f 'apt|dpkg' || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
            sudo dpkg --configure -a || true
          done
          exit 1
      - run: npm run test:browser
