name: Validar pull request
on: pull_request
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # Imagen oficial con los navegadores y sus dependencias ya instalados: no usa apt,
    # cuyo espejo en GitHub ha llegado a tardar más de 6 minutos en bajar 52 MB.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run demo
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
