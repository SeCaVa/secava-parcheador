name: Verificar y publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [translation-release]
  schedule:
    - cron: '23 8 * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache
          key: patches-${{ runner.os }}-${{ github.run_id }}
          restore-keys: patches-${{ runner.os }}-
      - name: Detectar manifiestos de compatibilidad
        id: releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:releases -- --import
      - name: Evitar despliegues programados sin cambios
        id: decision
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.releases.outputs.changed }}
        run: |
          # El despliegue diario también refresca el contador de descargas.
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - run: npm run demo
        if: steps.decision.outputs.deploy == 'true'
      - run: npm test
        if: steps.decision.outputs.deploy == 'true'
      - run: npm run build
        if: steps.decision.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Relative URLs support both repository Pages and custom domains.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        if: steps.decision.outputs.deploy == 'true'
      - name: Instalar navegadores de prueba (con reintentos)
        if: steps.decision.outputs.deploy == 'true'
        timeout-minutes: 25
        run: |
          for intento in 1 2 3; do
            timeout 420 npx playwright install --with-deps chromium firefox webkit && exit 0
            echo "Intento $intento fallido o colgado; limpiando apt y reintentando…"
            # Cortar apt a medias deja el cerrojo de dpkg puesto: se libera antes de repetir.
            sudo pkill -9 -f 'apt|dpkg' || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
            sudo dpkg --configure -a || true
          done
          exit 1
      - run: npm run test:browser
        if: steps.decision.outputs.deploy == 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: test-results/
      - uses: actions/upload-pages-artifact@v4
        if: steps.decision.outputs.deploy == 'true'
        with:
          path: dist
  deploy:
    if: needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar el artefacto verificado
        id: deployment
        uses: actions/deploy-pages@v4
